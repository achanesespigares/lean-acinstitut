# Publica el libro en GitHub Pages en cada push a main.
# Activa Pages en el repositorio: Settings → Pages → Source: GitHub Actions.
name: Publicar libro
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    env:
      # Si publicas en un dominio propio (p. ej. lean.acinstitut.com), borra esta línea
      BASE_URL: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar MyST (versión fijada en package.json)
        run: npm ci
      - name: Construir el libro
        run: npx myst build --html
      - name: Copiar las trazas
        run: |
          # las trazas de los visualizadores (las genera trazar.py con Lean de verdad)
          mkdir -p _build/html/datos
          cp -r datos/. _build/html/datos/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

  # Publicar en un trabajo aparte, como en la plantilla oficial de GitHub: con la subida y la
  # publicación en el mismo trabajo, deploy-pages a veces no encontraba el artefacto recién subido.
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
