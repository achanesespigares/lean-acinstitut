        - file: capitulos/10-calc.md
    - title: Parte III · Inducción y números
      children:
        - file: capitulos/11-induccion.md
        - file: capitulos/12-divisibilidad.md
        - file: capitulos/13-desigualdades.md
        - file: capitulos/14-ring.md
        - file: capitulos/15-congruencias.md
    - title: Parte IV · Matemáticas con Mathlib
      children:
        - file: capitulos/16-conjuntos.md
        - file: capitulos/17-inyectivas.md
        - file: capitulos/18-sucesiones.md
